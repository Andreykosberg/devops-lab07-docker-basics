# HTTPS server configuration.
# Сертификат и ключ НЕ лежат в образе - они пробрасываются в контейнер
# во время запуска через volume mapping (-v ./ssl:/etc/nginx/ssl:ro),
# поэтому во время docker build этих файлов еще не существует и
# "RUN nginx -t" на этапе сборки для этого образа не выполняется.
server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        root /var/www/html;
        index index.html;

        location / {
                try_files $uri $uri/ =404;
        }
}
